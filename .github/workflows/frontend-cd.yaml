name: Frontend Continuous Deployment

on:
  push:
    branches: [main]
    paths:
      - 'starter/frontend/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER_NAME: cluster

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter/frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js and npm cache
        uses: actions/setup-node@v4
        with:
          node-version-file: starter/frontend/.nvmrc
          cache: npm
          cache-dependency-path: starter/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: ESLint
        run: npm run lint

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter/frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js and npm cache
        uses: actions/setup-node@v4
        with:
          node-version-file: starter/frontend/.nvmrc
          cache: npm
          cache-dependency-path: starter/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        env:
          CI: 'true'
        run: npm test

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.push.outputs.image }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Setup kubectl for backend discovery
        uses: azure/setup-kubectl@v4
        with:
          version: v1.35.0
      - name: Discover public backend URL
        id: backend-url
        env:
          OVERRIDE_URL: ${{ vars.REACT_APP_MOVIE_API_URL }}
        run: |
          set -euo pipefail
          if [ -n "$OVERRIDE_URL" ]; then
            BACKEND_URL="$OVERRIDE_URL"
          else
            aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION"
            HOST=""
            for attempt in $(seq 1 30); do
              HOST=$(kubectl get service backend -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)
              [ -n "$HOST" ] && break
              sleep 10
            done
            if [ -z "$HOST" ]; then
              echo "No backend public hostname found. Deploy Backend Continuous Deployment first." >&2
              exit 1
            fi
            BACKEND_URL="http://$HOST"
          fi
          echo "backend_url=${BACKEND_URL%/}" >> "$GITHUB_OUTPUT"
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push tagged image with backend URL
        id: push
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REACT_APP_MOVIE_API_URL: ${{ steps.backend-url.outputs.backend_url }}
        run: |
          set -euo pipefail
          IMAGE="${ECR_REGISTRY}/frontend:${{ github.sha }}"
          docker build --build-arg "REACT_APP_MOVIE_API_URL=${REACT_APP_MOVIE_API_URL}" -t "$IMAGE" starter/frontend
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

  deploy:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.35.0
      - name: Connect to EKS
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION"
      - name: Apply Kubernetes manifests with SHA-tagged image
        env:
          IMAGE: ${{ needs.build.outputs.image }}
        run: |
          set -euo pipefail
          cat >> starter/frontend/k8s/kustomization.yaml <<EOF
          images:
            - name: frontend
              newName: ${IMAGE%:*}
              newTag: ${IMAGE##*:}
          EOF
          kubectl kustomize starter/frontend/k8s | kubectl apply -f -
          kubectl rollout status deployment/frontend --timeout=300s
          kubectl get svc frontend
      - name: Show frontend URL
        run: |
          HOST=$(kubectl get service frontend -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)
          if [ -n "$HOST" ]; then
            echo "### Frontend URL" >> "$GITHUB_STEP_SUMMARY"
            echo "http://$HOST" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "LoadBalancer URL pending; run kubectl get svc frontend in AWS CloudShell." >> "$GITHUB_STEP_SUMMARY"
          fi
